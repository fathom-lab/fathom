[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom-depth"
version = "0.1.0"
description = "Reasoning depth scoring via SAE circuit attribution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "darkflobi"},
]
keywords = [
    "mechanistic-interpretability",
    "sparse-autoencoder",
    "reasoning-depth",
    "language-models",
    "circuit-analysis",
    "AI-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
]

[project.optional-dependencies]
# Full local scoring (requires GPU + CUDA)
local = [
    "torch>=2.1",
    "transformers>=4.40",
    "transformer-lens>=2.0",
    "einops>=0.7",
    "circuit-tracer>=0.4",
    "safetensors>=0.4",
    "sentencepiece>=0.1",
    "jaxtyping>=0.2",
    "nnsight>=0.3",
]
# API server
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
]
# Analysis and visualization
analysis = [
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "Pillow>=10.0",
]
# Everything
all = [
    "fathom-depth[local,api,analysis]",
]
# Development
dev = [
    "fathom-depth[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://darkflobi.com/fathom"
Repository = "https://github.com/darkflobi/fathom"
Documentation = "https://darkflobi.com/fathom/docs"

[project.scripts]
fathom = "fathom_cli:main"

[tool.setuptools]
py-modules = [
    "depth_scorer",
    "fathom_score",
    "fathom_cli",
    "fathom_correctness",
    "fathom_benchmark",
    "fathom_hallucination_v3",
    "fathom_adversarial",
    "fathom_filter",
    "fathom_temporal",
    "fathom_saturation",
    "fathom_dna",
    "fathom_compare_demo",
    "depth_api_v2",
]
packages = ["fathom", "sdk"]

[tool.setuptools.package-data]
fathom = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
