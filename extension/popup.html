<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 280px;
  background: #0a0a0a;
  color: #c0c0c0;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 12px;
  padding: 16px;
}

.header {
  text-align: center;
  padding-bottom: 12px;
  border-bottom: 1px solid #1e1e1e;
  margin-bottom: 12px;
}

.header h1 {
  font-size: 20px;
  letter-spacing: 8px;
  color: #00ff00;
  text-shadow: 0 0 10px rgba(0,255,0,0.3);
}

.header .sub {
  font-size: 9px;
  color: #666;
  letter-spacing: 2px;
  margin-top: 2px;
}

.score-display {
  text-align: center;
  padding: 16px 0;
}

.grade-badge {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 4px;
}

.score-number {
  font-size: 14px;
  color: #666;
}

.interpretation {
  font-size: 10px;
  color: #888;
  text-align: center;
  margin: 8px 0;
  line-height: 1.5;
}

.details {
  background: #141414;
  border: 1px solid #1e1e1e;
  padding: 8px 12px;
  margin: 8px 0;
  font-size: 10px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}

.detail-label { color: #666; }
.detail-value { color: #c0c0c0; }

.text-preview {
  font-size: 10px;
  color: #444;
  margin-top: 8px;
  line-height: 1.4;
  max-height: 40px;
  overflow: hidden;
  font-style: italic;
}

.empty {
  text-align: center;
  color: #444;
  padding: 24px 0;
  font-size: 11px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px solid #1e1e1e;
  font-size: 9px;
  color: #333;
}

.grade-S, .grade-A { color: #00ff00; }
.grade-B { color: #ffd700; }
.grade-C { color: #ff9800; }
.grade-D, .grade-F { color: #ff3d00; }
</style>
</head>
<body>

<div class="header">
  <h1>FATHOM</h1>
  <div class="sub">REASONING DEPTH</div>
</div>

<div id="content">
  <div class="empty">
    Select AI-generated text.<br>
    Right-click > "Score with Fathom"
  </div>
</div>

<div class="footer">darkflobi &middot; fathom v2.0</div>

<script src="popup.js"></script>
</body>
</html>
