<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>charades</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--s:#111;--b:#1a1a1a;--t:#999;--d:#444;--g:#00ff00;--gd:#0a0;--m:'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t);font-family:var(--m);font-size:13px}

.page{display:flex;flex-direction:column;height:100%}

/* header */
.hdr{padding:8px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr .logo{color:var(--g);font-size:15px;letter-spacing:5px;font-weight:700}
.hdr .sub{font-size:9px;color:var(--d);letter-spacing:2px}

/* chat */
.chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:2px}

/* messages */
.msg{max-width:90%;animation:mi .2s ease-out}
@keyframes mi{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.msg.user{align-self:flex-end;padding:8px 14px;background:#141414;border:1px solid var(--b);border-radius:8px;color:var(--t);font-size:13px}

.msg.flobi{align-self:flex-start;max-width:100%}
.msg.flobi .scene{
  white-space:pre;
  font-size:11px;
  line-height:1.15;
  color:var(--g);
  text-shadow:0 0 4px rgba(0,255,0,0.08);
  background:#080808;
  border:1px solid #151515;
  border-radius:6px;
  padding:12px 16px;
  overflow-x:auto;
  user-select:none;
}
.msg.flobi .scene.animating{
  border-color:var(--gd);
  box-shadow:0 0 10px rgba(0,255,0,0.05);
}
.msg.flobi .caption{
  font-size:11px;
  color:#7a7;
  margin-top:6px;
  padding:0 4px;
  line-height:1.5;
}
.msg.flobi .mood-tag{
  font-size:8px;
  color:var(--d);
  letter-spacing:2px;
  margin-top:3px;
  padding:0 4px;
  text-transform:uppercase;
}

.typing{font-size:9px;color:var(--gd);letter-spacing:3px;padding:6px 20px;display:none;flex-shrink:0}
.typing.on{display:block;animation:p 1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.3}50%{opacity:1}}

/* input */
.ibar{display:flex;gap:6px;padding:10px 20px;border-top:1px solid var(--b);flex-shrink:0}
.ibar input{flex:1;background:var(--s);border:1px solid var(--b);color:var(--g);font-family:var(--m);font-size:12px;padding:8px 12px;border-radius:4px;outline:none}
.ibar input:focus{border-color:#1a3a1a}
.ibar input::placeholder{color:#222}
.ibar button{background:#1a2a1a;border:1px solid #1a3a1a;color:var(--g);font-family:var(--m);font-size:10px;padding:8px 14px;border-radius:4px;cursor:pointer;letter-spacing:2px}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <span class="logo">CHARADES</span>
    <span class="sub">LIVE ASCII AGENT — GENERATIVE SCENES</span>
  </div>
  <div class="chat" id="chat"></div>
  <div class="typing" id="typing">darkflobi is drawing...</div>
  <div class="ibar">
    <input id="input" placeholder="say anything — darkflobi will act it out..." autocomplete="off"/>
    <button onclick="send()">SEND</button>
  </div>
</div>

// ── SCENE COMPOSER ────────────────────────────────────────────
// Canvas where flobi can place himself + objects anywhere

class Scene {
  constructor(w = 60, h = 20) {
    this.w = w;
    this.h = h;
    this.grid = [];
    this.clear();
  }

  clear() {
    this.grid = Array.from({ length: this.h }, () => Array(this.w).fill(' '));
  }

  // Place a multi-line string block at (x, y) where y=0 is TOP
  place(lines, x, y) {
    for (let row = 0; row < lines.length; row++) {
      for (let col = 0; col < lines[row].length; col++) {
        const ch = lines[row][col];
        if (ch === ' ') continue; // transparent
        const gy = y + row;
        const gx = x + col;
        if (gy >= 0 && gy < this.h && gx >= 0 && gx < this.w) {
          this.grid[gy][gx] = ch;
        }
      }
    }
  }

  // Place character at position (ground-relative: y=0 = bottom)
  placeChar(pose, x) {
    const lines = POSE[pose] || POSE.stand;
    const y = this.h - lines.length; // feet on ground
    this.place(lines, x, y);
  }

  // Place object at position
  placeObj(name, x, y) {
    const lines = OBJ[name];
    if (!lines) return;
    this.place(lines, x, y);
  }

  // Add ground
  addGround() {
    const y = this.h - 1;
    for (let x = 0; x < this.w; x++) {
      if (this.grid[y][x] === ' ') this.grid[y][x] = (x % 3 === 0) ? '.' : '_';
    }
  }

  // Add starry sky
  addStars() {
    for (let i = 0; i < 12; i++) {
      const x = Math.floor(Math.random() * this.w);
      const y = Math.floor(Math.random() * 4);
      if (this.grid[y][x] === ' ') this.grid[y][x] = Math.random() > 0.5 ? '*' : '.';
    }
  }

  toString() {
    return this.grid.map(row => row.join('')).join('\n');
  }
}

// ── TOPIC DETECTION ───────────────────────────────────────────

  { p: /\b(hi|hello|hey|yo|sup)\b/i, scene: 'greet' },

function detectScene(text) {
  for (const r of TOPIC_RULES) if (r.p.test(text)) return r.scene;
  return 'neutral';
}

// ── ANIMATED SCENE RENDERING ──────────────────────────────────
// Draws scene character by character for "live drawing" effect

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.textContent = text;
  chatEl.appendChild(d);
  scrollChat();
}

function scrollChat() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

const chatEl = document.getElementById('chat');
const typingEl = document.getElementById('typing');

function addScene(sceneData, mood) {
  return new Promise(resolve => {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg flobi';

    const sceneEl = document.createElement('div');
    sceneEl.className = 'scene animating';
    wrapper.appendChild(sceneEl);

    const captionEl = document.createElement('div');
    captionEl.className = 'caption';
    wrapper.appendChild(captionEl);

    const moodTag = document.createElement('div');
    moodTag.className = 'mood-tag';
    moodTag.textContent = mood;
    wrapper.appendChild(moodTag);

    chatEl.appendChild(wrapper);
    scrollChat();

    // Animate: draw scene character by character
    const full = sceneData.scene.toString();
    const chars = full.split('');
    let idx = 0;
    const batchSize = 8; // chars per frame
    const interval = 12; // ms per batch

    function drawBatch() {
      let chunk = '';
      for (let i = 0; i < batchSize && idx < chars.length; i++, idx++) {
        chunk += chars[idx];
      }
      sceneEl.textContent = full.slice(0, idx);
      scrollChat();

      if (idx < chars.length) {
        setTimeout(drawBatch, interval);
      } else {
        // Done drawing — add caption with typewriter
        sceneEl.classList.remove('animating');
        typeCaption(captionEl, sceneData.caption, resolve);
      }
    }

    drawBatch();
  });
}

function typeCaption(el, text, done) {
  let i = 0;
  function type() {
    el.textContent = text.slice(0, i);
    i++;
    scrollChat();
    if (i <= text.length) setTimeout(type, 30);
    else if (done) done();
  }
  type();
}

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

// ── SEND ──────────────────────────────────────────────────────

let busy = false;

async function send() {
  if (busy) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addUser(text);
  busy = true;

  // Detect what scene to draw
  const sceneName = detectScene(text);
  const sceneFn = SCENES[sceneName] || SCENES.neutral;

  // Show "drawing" state
  typingEl.classList.add('on');
  await new Promise(r => setTimeout(r, 300 + Math.random() * 500));
  typingEl.classList.remove('on');

  // Generate and animate the scene
  const sceneData = sceneFn();
  await addScene(sceneData, sceneName);

  busy = false;
}

// Keyboard
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

// ── OPENING SCENE ─────────────────────────────────────────────

(async function init() {
  await new Promise(r => setTimeout(r, 400));
  const opening = SCENES.greet();
  await addScene(opening, 'greet');
})();
